name: Deploy

# Publishes to particles.sundbergsolutions.se (S3 + CloudFront). The shared workflow handles the
# build, the cache headers and the three-pass upload; see static-s3.md in theted/infrastructure.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    uses: theted/workflows/.github/workflows/deploy-static.yml@master
    with:
      node-version: '22'
      build-command: npm run build
      dist-dir: dist
    # Named one by one: `secrets: inherit` only crosses into reusable workflows owned by the same
    # account or organization, and this repo (SundbergMedia) calls one owned by theted.
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
